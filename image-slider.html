
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f3f4f6;
      padding: 30px 15px;
    }
    .slider { max-width: 650px; margin: auto; }
    img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 12px;
    }
    button {
      padding: 12px 25px;
      margin: 15px 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Image Slider</h2>

  <div class="slider">
    <img id="slide" src="" alt="Slider image">
    <div>
      <button onclick="previous()">Previous</button>
      <button onclick="next()">Next</button>
    </div>
    <p id="counter"></p>
  </div>

  <script>
    const images = [
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=80"
    ];

    let index = 0;

    function showImage() {
      document.getElementById("slide").src = images[index];
      document.getElementById("counter").textContent =
        `Image ${index + 1} of ${images.length}`;
    }

    function next() {
      index = (index + 1) % images.length;
      showImage();
    }

    function previous() {
      index = (index - 1 + images.length) % images.length;
      showImage();
    }

    showImage();
  </script>
</body>
</html>
