
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Calculator</title>
  <style>
    body {
      font-family: Arial;
      background: #dbeafe;
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
    }
    .calculator {
      width: min(320px, 90vw);
      padding: 20px;
      background: #172033;
      border-radius: 18px;
      box-shadow: 0 15px 35px #94a3b8;
    }
    #display {
      width: 100%;
      box-sizing: border-box;
      height: 70px;
      margin-bottom: 15px;
      padding: 12px;
      background: #f8fafc;
      border: 0;
      border-radius: 8px;
      font-size: 28px;
      text-align: right;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      padding: 17px 5px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #e2e8f0;
    }
    button:hover { background: #cbd5e1; }
    .operator { background: #93c5fd; }
    .clear { background: #fca5a5; }
    .equal { background: #86efac; }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" value="0" readonly aria-label="Calculator display">

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="chooseOperator('%')">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="digit('7')">7</button>
      <button onclick="digit('8')">8</button>
      <button onclick="digit('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="digit('4')">4</button>
      <button onclick="digit('5')">5</button>
      <button onclick="digit('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="digit('1')">1</button>
      <button onclick="digit('2')">2</button>
      <button onclick="digit('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button onclick="digit('0')">0</button>
      <button onclick="decimal()">.</button>
      <button onclick="toggleSign()">±</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let current = "0";
    let stored = null;
    let operator = null;
    let fresh = false;

    function update() {
      display.value = current;
    }

    function digit(value) {
      if (fresh || current === "Error") {
        current = value;
        fresh = false;
      } else {
        current = current === "0" ? value : current + value;
      }
      update();
    }

    function decimal() {
      if (fresh || current === "Error") {
        current = "0";
        fresh = false;
      }
      if (!current.includes(".")) current += ".";
      update();
    }

    function chooseOperator(op) {
      if (current === "Error") return;
      if (operator && !fresh) calculate();
      stored = Number(current);
      operator = op;
      fresh = true;
    }

    function calculate() {
      if (stored === null || !operator || current === "Error") return;

      const a = stored;
      const b = Number(current);
      let result;

      switch (operator) {
        case "+": result = a + b; break;
        case "-": result = a - b; break;
        case "*": result = a * b; break;
        case "/":
          if (b === 0) {
            current = "Error";
            stored = null;
            operator = null;
            fresh = true;
            update();
            return;
          }
          result = a / b;
          break;
        case "%": result = a % b; break;
      }

      current = String(Number(result.toPrecision(12)));
      stored = null;
      operator = null;
      fresh = true;
      update();
    }

    function clearDisplay() {
      current = "0";
      stored = null;
      operator = null;
      fresh = false;
      update();
    }

    function deleteLast() {
      if (fresh || current === "Error") {
        current = "0";
        fresh = false;
      } else {
        current = current.length > 1 ? current.slice(0, -1) : "0";
        if (current === "-") current = "0";
      }
      update();
    }

    function toggleSign() {
      if (current === "Error") return;
      current = String(-Number(current));
      update();
    }
  </script>
</body>
</html>
