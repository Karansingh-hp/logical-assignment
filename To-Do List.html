
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      padding: 35px 15px;
    }
    .todo {
      max-width: 550px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px #cbd5e1;
    }
    form {
      display: flex;
      gap: 8px;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
    }
    button {
      padding: 10px 13px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }
    .add { color: white; background: #4f46e5; }
    ul { padding: 0; list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    li span { flex: 1; overflow-wrap: anywhere; }
    .done { text-decoration: line-through; color: #6b7280; }
    .edit { background: #fef3c7; }
    .delete { background: #fee2e2; }
    .task-check { flex: 0 0 auto; width: 18px; height: 18px; }
    @media (max-width: 420px) {
      li { flex-wrap: wrap; }
      li span { min-width: 65%; }
    }
  </style>
</head>
<body>
  <div class="todo">
    <h2> My To-Do List</h2>

    <form id="taskForm">
      <input id="taskInput" placeholder="Enter a new task" required>
      <button class="add" type="submit">Add</button>
    </form>

    <p id="count">0 tasks remaining</p>
    <ul id="taskList"></ul>
  </div>

  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    const count = document.getElementById("count");

    let tasks = [];

    try {
      tasks = JSON.parse(localStorage.getItem("myTasks")) || [];
      if (!Array.isArray(tasks)) tasks = [];
    } catch {
      tasks = [];
    }

    function saveTasks() {
      try {
        localStorage.setItem("myTasks", JSON.stringify(tasks));
      } catch {
        alert("Tasks could not be saved in this browser.");
      }
    }

    function renderTasks() {
      list.replaceChildren();

      tasks.forEach((task) => {
        const li = document.createElement("li");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Mark task complete");
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.textContent = task.text;
        if (task.done) text.className = "done";

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "edit";
        editButton.addEventListener("click", () => {
          const updated = prompt("Edit task:", task.text);
          if (updated !== null && updated.trim()) {
            task.text = updated.trim();
            saveTasks();
            renderTasks();
          }
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";
        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter((item) => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        li.append(checkbox, text, editButton, deleteButton);
        list.appendChild(li);
      });

      const remaining = tasks.filter((task) => !task.done).length;
      count.textContent = `${remaining} tasks remaining`;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.push({
        id: Date.now() + Math.random(),
        text,
        done: false
      });

      input.value = "";
      saveTasks();
      renderTasks();
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
